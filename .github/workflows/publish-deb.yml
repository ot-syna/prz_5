name: Build & Publish syspulse .deb to Nexus (APT)

on:
  push:
    branches: ["release"]
  workflow_dispatch:

env:
  GO_VERSION: "1.21"
  APT_DIST: stable
  APT_COMPONENT: main
  NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
  NEXUS_USER: ${{ secrets.NEXUS_USER }}
  NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

jobs:
  build-publish-verify:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Сборка статического бинарника под linux/amd64
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build static Linux binary
        run: |
          if (!(Test-Path "dist")) { New-Item -ItemType Directory -Path "dist" | Out-Null }
          $env:GOOS = "linux"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -o dist/syspulse .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist/syspulse | Select-Object Name, Length

      # 2. Упаковка в .deb внутри Ubuntu-контейнера (dpkg-deb)
      - name: Package as .deb
        id: pack
        run: |
          $match = Select-String -Path "main.go" -Pattern 'const Version = "([0-9.]+)"'
          if (-not $match) {
            Write-Error "Failed to extract Version from main.go"
            exit 1
          }
          $ver = $match.Matches[0].Groups[1].Value
          $pkg = "syspulse"
          Write-Host "Building package $pkg version $ver"

          $root = "build/${pkg}_${ver}"
          $debPath = "dist/${pkg}_${ver}_amd64.deb"
          "pkg_ver=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "deb_path=$debPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Path "$root/DEBIAN", "$root/usr/bin", "dist" -Force | Out-Null
          Copy-Item "dist/syspulse" "$root/usr/bin/$pkg" -Force

          $control = @(
            "Package: $pkg",
            "Version: $ver",
            "Section: utils",
            "Priority: optional",
            "Architecture: amd64",
            "Maintainer: DevOps Team <devops@example.com>",
            "Description: Lightweight CLI tool for a system health snapshot",
            " Reads /proc and reports uptime, load average and memory info.",
            "Depends: libc6 (>= 2.17)",
            ""
          ) -join "`n"
          $workDir = (Get-Location).Path
          $controlPath = Join-Path $workDir "$root/DEBIAN/control"
          [System.IO.File]::WriteAllText($controlPath, $control, [System.Text.UTF8Encoding]::new($false))

          docker run --rm -v "${workDir}:/work" -w /work ubuntu:22.04 bash -c "rm -rf /tmp/pkg && mkdir -p /tmp/pkg && cp -r ${root} /tmp/pkg/pkgroot && chmod 755 /tmp/pkg/pkgroot /tmp/pkg/pkgroot/DEBIAN /tmp/pkg/pkgroot/usr/bin/${pkg} && chmod 644 /tmp/pkg/pkgroot/DEBIAN/control && dpkg-deb --build --root-owner-group /tmp/pkg/pkgroot ${debPath} && dpkg -I ${debPath}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 3. Публикация в Nexus (APT deploy)
      - name: Upload .deb to Nexus (APT deploy)
        run: |
          $workDir = (Get-Location).Path
          $debPath = "${{ steps.pack.outputs.deb_path }}"
          $debName = Split-Path -Path $debPath -Leaf
          $url = "http://$($env:NEXUS_HOST):8081/repository/syspulse/deb/binary/$($env:APT_DIST)/$($env:APT_COMPONENT)/syspulse/binary/amd64/$debName"

          docker run --rm --add-host=host.docker.internal:host-gateway -v "${workDir}:/work" -w /work curlimages/curl:latest `
            --fail --silent --show-error `
            --user "$($env:NEXUS_USER):$($env:NEXUS_PASSWORD)" `
            -H "Content-Type: application/vnd.debian.binary-package" `
            --upload-file "$debPath" `
            "$url"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Package $debName deployed to Nexus APT repository 'syspulse'."

      # 4. Верификация установки через apt в чистом Ubuntu
      - name: Verify install via apt in Ubuntu container
        run: |
          Write-Host "Installing syspulse from Nexus inside a clean ubuntu:22.04..."
          $workDir = (Get-Location).Path
          $verifyScript = @(
            'set -euo pipefail',
            'apt-get update -y',
            'apt-get install -y --no-install-recommends ca-certificates curl || true',
            'echo "deb [trusted=yes] http://${NEXUS_HOST}:8081/repository/syspulse/ ${APT_DIST} ${APT_COMPONENT}" > /etc/apt/sources.list.d/syspulse.list',
            'apt-get update',
            'apt-get install -y syspulse',
            'echo "---- package info ----"',
            'dpkg -s syspulse | grep -E "^(Package|Version|Architecture)"',
            'echo "---- run app ----"',
            'syspulse --version',
            'syspulse',
            ''
          ) -join "`n"
          $scriptPath = Join-Path $workDir "verify.sh"
          [System.IO.File]::WriteAllText($scriptPath, $verifyScript, [System.Text.UTF8Encoding]::new($false))

          try {
            docker run --rm --add-host=host.docker.internal:host-gateway -v "${workDir}:/work" -w /work `
              -e "NEXUS_HOST=$($env:NEXUS_HOST)" `
              -e "APT_DIST=$($env:APT_DIST)" `
              -e "APT_COMPONENT=$($env:APT_COMPONENT)" `
              ubuntu:22.04 bash /work/verify.sh
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item $scriptPath -ErrorAction SilentlyContinue
          }
          Write-Host "Verification passed: syspulse installed from Nexus and runs correctly."

      # 5. Артефакты (для аудита)
      - name: Save .deb as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syspulse-deb
          path: dist/*.deb
          retention-days: 7
